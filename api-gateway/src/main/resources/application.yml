spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/auth/**
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/payments/**
        - id: stock-service
          uri: http://${STOCK_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/stocks/**

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:msa-commerce-jwt-secret-key-must-be-at-least-256-bits-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info
