# PR 시 변경된 서비스만 빌드/테스트하고 이미지 빌드를 검증하는 CI 파이프라인
# 운영은 Podman 으로 배포되므로 이미지 빌드 검증도 buildah(=Podman 빌더)로 수행한다.
name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # 변경된 서비스 감지 (CI/CD 공용 재사용 워크플로우)
  changes:
    uses: ./.github/workflows/detect-changes.yml

  # 백엔드: Gradle 빌드 + 단위 테스트
  backend-test:
    needs: changes
    if: needs.changes.outputs.any_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.backend) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & Test (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

  # 백엔드 이미지 빌드 검증 (buildah, push 안 함)
  backend-image:
    needs: [ changes, backend-test ]
    if: needs.changes.outputs.any_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.backend) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image with buildah (no push)
        run: buildah bud -f ${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci .

  # 프론트엔드: 빌드 + 이미지 빌드 검증
  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build image with buildah (no push)
        run: buildah bud -f frontend/Dockerfile -t frontend:ci ./frontend
