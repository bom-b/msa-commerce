# main push 시 변경된 서비스 이미지를 GHCR 에 빌드/푸시하고 서버에 Podman 으로 배포한다.
# 이미지 빌드/푸시는 buildah + podman(=운영 런타임과 동일)으로 수행한다.
name: CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # 변경된 서비스 감지 (CI/CD 공용 재사용 워크플로우)
  changes:
    uses: ./.github/workflows/detect-changes.yml

  # 백엔드 이미지 빌드 + GHCR 푸시
  build-push-backend:
    needs: changes
    if: needs.changes.outputs.any_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.backend) }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ghcr.io/${{ steps.vars.outputs.repo }}/${{ matrix.service }}
          tags: latest ${{ github.sha }}
          containerfiles: ./${{ matrix.service }}/Dockerfile
          context: .
      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}

  # 프론트엔드 이미지 빌드 + GHCR 푸시
  build-push-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ghcr.io/${{ steps.vars.outputs.repo }}/frontend
          tags: latest ${{ github.sha }}
          containerfiles: ./frontend/Dockerfile
          context: ./frontend
      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}

  # 서버 배포 (Podman). 빌드 잡이 실패하지 않았고 배포 대상 변경이 있을 때만 수행.
  deploy:
    needs: [ changes, build-push-backend, build-push-frontend ]
    if: >
      always()
      && needs.changes.outputs.deploy == 'true'
      && needs.build-push-backend.result != 'failure'
      && needs.build-push-frontend.result != 'failure'
      && needs.build-push-backend.result != 'cancelled'
      && needs.build-push-frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # 최신 compose / nginx / init.sql 반영 (bind mount 대상)
            git pull --ff-only
            # GHCR 로그인 (read:packages 권한 토큰)
            echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            # 최신 이미지 pull 후 재기동
            podman-compose -f docker-compose.yml pull
            podman-compose -f docker-compose.yml up -d
            # 미사용 이미지 정리
            podman image prune -f
