server {
    listen 80;

    location /images/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}
